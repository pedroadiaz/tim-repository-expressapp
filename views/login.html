<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Work+Sans:300,400,500,600,700'>
    <style>
        body {
            margin: 0;
            color: #c9c9c9;
            background: #f0f0f0;
            font-family: 'Work Sans', sans-serif;
            font-size: 1.1rem;
        }

        .background-cover {
            
            position: absolute;
            height: 45vh;
            width: 100%;
        }

        *,
        :after,
        :before {
            box-sizing: border-box
        }

        .clearfix:after,
        .clearfix:before {
            content: '';
            display: table
        }

        .clearfix:after {
            clear: both;
            display: block
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .login-wrap {
            width: 100%;
            margin: auto;
            max-width: 700px;
            min-height: 670px;
            position: relative;
            
            box-shadow: 0 12px 15px 0 rgba(0, 0, 0, .3), 0 17px 50px 0 rgba(0, 0, 0, .3);
        }

        .login-html {
            width: 100%;
            height: 100%;
            position: absolute;
            padding: 90px 70px 50px 70px;
            
            background: linear-gradient(180deg, rgb(42, 82, 149) 0%, rgb(161, 109, 182) 40%);
        }

        .login-html .sign-in-htm,
        .login-html .sign-up-htm {
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            position: absolute;
            transform: rotateY(180deg);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transition: all .4s linear;
        }

        .login-html .sign-in,
        .login-html .sign-up,
        .login-form .group .check {
            display: none;
        }

        .login-html .tab,
        .login-form .group .label,
        .login-form .group .button {
            text-transform: uppercase;
        }

        .login-html .tab {
            font-size: 25px;
            margin-right: 15px;
            padding-bottom: 5px;
            margin: 0 15px 10px 0;
            display: inline-block;
            border-bottom: 2px solid transparent;
        }

        .login-html .sign-in:checked+.tab,
        .login-html .sign-up:checked+.tab {
            color: #fff;
            border-color: #f0f0f0;
        }

        .login-form {
            min-height: 345px;
            position: relative;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .login-form .group {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .login-form .group .label,
        .login-form .group .input,
        .login-form .group .button {
            width: 100%;
            color: #fff;
            display: block;
        }

        .login-form .group .input,
        .login-form .group .button {
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .1);
        }

        .login-form .group input[data-type="password"] {
            input-security: auto;
            -webkit-text-security: circle;
        }

        .login-form .group .label {
            color: #e7e7e7;
            font-size: 15px;
            padding-bottom: 10px;
        }

        .login-form .group .button {
            background: #7f578f;
        }

        .login-form .group label .icon {
            width: 15px;
            height: 15px;
            border-radius: 2px;
            position: relative;
            display: inline-block;
            background: rgba(255, 255, 255, .1);
        }

        .login-form .group label .icon:before,
        .login-form .group label .icon:after {
            content: '';
            width: 10px;
            height: 2px;
            background: #fff;
            position: absolute;
            transition: all .2s ease-in-out 0s;
        }

        .login-form .group label .icon:before {
            left: 3px;
            width: 5px;
            bottom: 6px;
            transform: scale(0) rotate(0);
        }

        .login-form .group label .icon:after {
            top: 6px;
            right: 0;
            transform: scale(0) rotate(0);
        }

        .login-form .group .check:checked+label {
            color: #fff;
        }

        .login-form .group .check:checked+label .icon {
            background: #1161ee;
        }

        .login-form .group .check:checked+label .icon:before {
            transform: scale(1) rotate(45deg);
        }

        .login-form .group .check:checked+label .icon:after {
            transform: scale(1) rotate(-45deg);
        }

        .login-html .sign-in:checked+.tab+.sign-up+.tab+.login-form .sign-in-htm {
            transform: rotate(0);
        }

        .login-html .sign-up:checked+.tab+.login-form .sign-up-htm {
            transform: rotate(0);
        }

        .hr {
            height: 2px;
            margin: 60px 0 50px 0;
            background: rgba(255, 255, 255, .2);
        }

        .foot-lnk {
            text-align: center;
            font-size: 1.1rem;
        }
        
        .message {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .message.success {
            background-color: rgba(0, 255, 0, 0.1);
            color: #ccffcc;
        }
        
        .message.error {
            background-color: rgba(255, 0, 0, 0.1);
            color: #ffcccc;
            font-weight: bold;
        }
        
        .password-requirements {
            color: #e7e7e7;
            font-size: 0.9rem;
            margin-top: 5px;
            padding-left: 5px;
        }
    </style>
</head>

<body>
    <div class="background-cover"></div>

    <div class="login-wrap">
        <div class="login-html">
            <input id="tab-1" type="radio" name="tab" class="sign-in" checked><label for="tab-1" class="tab">Sign
                In</label>
            <input id="tab-2" type="radio" name="tab" class="sign-up"><label for="tab-2" class="tab">Sign Up</label>
            <div class="login-form">
                <div id="success-message" class="message success" style="display: none;"></div>
                <div class="sign-in-htm">
                    <form id="login" method="POST" action="./login">
                        <div class="group">
                            <label for="user" class="label">Email</label>
                            <input id="user" type="text" class="input" name="username">
                        </div>
                        <div class="group">
                            <label for="pass" class="label">Password</label>
                            <input id="pass" type="password" class="input" data-type="password" name="password">
                        </div>
                        <div class="group">
                            <input id="check" type="checkbox" class="check" checked name="rememberMe">
                            <label for="check"><span class="icon"></span> Remember me</label>
                        </div>
                        <div class="group">
                            <input type="submit" class="button" value="Sign In">
                        </div>
                    </form>
                    <div class="hr"></div>
                    <div class="foot-lnk">
                        <a href="./forgot-password">Forgot Password?</a>
                    </div>
                </div>
                <div class="sign-up-htm">
                    <div id="register-error" class="message error" style="display: none;"></div>
                    <form id="register" method="POST" action="./register">
                        <div class="group">
                            <label for="user" class="label">Email</label>
                            <input id="user" type="text" class="input" name="username">
                        </div>
                        <div class="group">
                            <label for="pass" class="label">Password</label>
                            <input id="pass" type="password" class="input" data-type="password" name="password">
                            <div class="password-requirements">
                                Password must have one number, one special character, and be at least 9 characters long
                            </div>
                        </div>
                        <div class="group">
                            <label for="pass" class="label">Repeat Password</label>
                            <input id="pass" type="password" class="input" data-type="password" name="confirmPassword">
                        </div>
                        <div class="group">
                            <label for="pass" class="label">Referral Code</label>
                            <input id="pass" type="text" class="input" name="referralCode">
                        </div>
                        <div class="group">
                            <input type="submit" class="button" value="Sign Up">
                        </div>
                    </form>
                    <div class="hr"></div>
                    <!--
                    <div class="foot-lnk">
                        <label for="tab-1">Already Member?</a>
                    </div>
                    -->
                </div>
            </div>
        </div>
    </div>


    <script>
        // Function to get URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Handle success message
        var success = getUrlParameter('success');
        if (success) {
            var successElement = document.getElementById('success-message');
            successElement.textContent = success;
            successElement.style.display = 'block';
        }

        // Handle register error message
        var registerError = getUrlParameter('registerError');
        if (registerError) {
            var errorElement = document.getElementById('register-error');
            errorElement.textContent = registerError;
            errorElement.style.display = 'block';
            
            // Switch to the signup tab
            document.getElementById('tab-2').checked = true;
        }
    </script>
</body>

</html>

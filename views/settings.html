<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SimpleReports Upgrade</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Work+Sans:300,400,500,600,700">
  <link rel="stylesheet" href="./css/desktopstyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./css/ffolders.min.css" />

  <style>
    .spacingFolder {
      margin-right: 30px;
      margin-bottom: 30px;
    }

    .spacingFolder:last-child {
      margin-right: 0;
    }

    #reportContents {
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Subscription section styles */
    .subscription-section {
      background-color: #f9f9f9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .subscription-section h2 {
      margin-top: 0;
      color: #333;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
    
    .subscription-info {
      margin-bottom: 20px;
    }
    
    .subscription-info p {
      margin: 5px 0;
    }
    
    .subscription-label {
      font-weight: bold;
      display: inline-block;
      width: 150px;
    }
    
    .subscription-actions {
      margin-top: 20px;
    }
    
    .subscription-button {
      background-color: #7f578f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
    }
    
    .subscription-button:hover {
      background-color: #6a4478;
    }
    
    /* Password change section styles */
    .password-section {
      background-color: #f9f9f9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .password-section h3 {
      margin-top: 0;
      color: #333;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
    
    .password-form {
      margin-top: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #333;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #7f578f;
    }
    
    .password-requirements {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    
    .password-submit {
      background-color: #7f578f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    
    .password-submit:hover {
      background-color: #6a4478;
    }
    
    .password-message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
    
    .password-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .password-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>

<body>
  <img src="./full_logo.png" alt="SimpleReports Logo" width="150px" class="logo"
    style="position: absolute; top: 0; left: 0" />
  <div id="chartpanel" class="row" data-equalizer>
    <div class="column small-12 left_panel">
      <header data-equalizer-watch>
        <!-- Hamburger menu removed as it was not functional -->

        <div class="right_nav">
          <div class="welcome-profile-text"><span class="user-name">
              <span id="welcome-name-display"></span>
            </span></div>

          <a href="/main"><i class="fa fa-home dashboard-icons dashboard-icons-next-to-another"
              aria-hidden="true" title="Home"></i></a>
          <a href="/logout"><i class="fa fa-sign-out-alt dashboard-icons dashboard-icons-next-to-another"
              aria-hidden="true" title="Logout"></i></a>

        </div>
        <div class="title">
          <h2 style="text-align: center;">SETTINGS</h2>
        </div>
      </header>


      <div id="chart_table">
        <form id="chart_datas">
        </form>

        <div id="details">
        </div>

      </div>
      <div class="spacer"></div>

    </div>
  </div>
  </div>
  <script>
    function PopulateDetails(accountType) {
      console.log("PopulateDetails");
      const reportContents = document.getElementById('details');
      const div = document.createElement('div');
      div.style.borderRadius = "10px";
      div.style.border = "1px solid #d3d3d3";
      div.style.padding = "10px";
      div.style.marginTop = "10px";
      const h3 = document.createElement('h3');
      h3.innerHTML = "Account Information";
      div.appendChild(h3);
      const p1 = document.createElement('p');
      p1.innerHTML = "Account Type: ";
      if (accountType === 1) {
        p1.innerHTML += "Trial";
      } else if (accountType === 2) {
        p1.innerHTML += "Active";
      } else {
        p1.innerHTML += "Inactive";
      }
      div.appendChild(p1);
      const p2 = document.createElement('p');
      if (accountType === 1) {
        p2.innerHTML = "Subscription Status: Trial";
      } else if (accountType === 2) {
        p2.innerHTML = "Subscription Status: Active";
      } else {
        p2.innerHTML = "Subscription Status: Inactive";
      }

      div.appendChild(p2);
      // Add subscription management section
      const subscriptionDiv = document.createElement('div');
      subscriptionDiv.style.borderRadius = "10px";
      subscriptionDiv.style.border = "1px solid #d3d3d3";
      subscriptionDiv.style.padding = "10px";
      subscriptionDiv.style.marginTop = "20px";
      subscriptionDiv.className = "subscription-section";
      
      const subscriptionTitle = document.createElement('h3');
      subscriptionTitle.innerHTML = "Subscription Management";
      subscriptionDiv.appendChild(subscriptionTitle);
      
      // Create subscription info div
      const subscriptionInfo = document.createElement('div');
      subscriptionInfo.className = "subscription-info";
      
      // Fetch user subscription details
      fetch('/app/getUser')
        .then(response => response.json())
        .then(userData => {
          // Add subscription status
          const statusP = document.createElement('p');
          const statusLabel = document.createElement('span');
          statusLabel.className = "subscription-label";
          statusLabel.innerHTML = "Status:";
          statusP.appendChild(statusLabel);
          
          if (userData.unlimited_access) {
            statusP.innerHTML += " Unlimited Access";
            
            const infoP = document.createElement('p');
            infoP.innerHTML = "You have unlimited access to SimpleReports.";
            subscriptionInfo.appendChild(infoP);
          } else if (userData.is_paid) {
            statusP.innerHTML += " Active Subscription";
            
            const infoP = document.createElement('p');
            infoP.innerHTML = "Your subscription is active. You have full access to SimpleReports.";
            subscriptionInfo.appendChild(infoP);
          } else if (userData.trial_end_date) {
            statusP.innerHTML += " Trial Period";
            
            const trialEndDate = new Date(userData.trial_end_date).toLocaleDateString();
            const infoP = document.createElement('p');
            infoP.innerHTML = `Your trial period ends on: <strong>${trialEndDate}</strong>`;
            subscriptionInfo.appendChild(infoP);
            
            const pricingP = document.createElement('p');
            pricingP.innerHTML = "After your trial ends, you will be charged $9.99/month.";
            subscriptionInfo.appendChild(pricingP);
          } else {
            statusP.innerHTML += " No Active Subscription";
          }
          
          subscriptionInfo.appendChild(statusP);
          
          // Add subscription actions
          const actionsDiv = document.createElement('div');
          actionsDiv.className = "subscription-actions";
          
          if (userData.stripe_customer_id && !userData.unlimited_access) {
            const manageButton = document.createElement('a');
            manageButton.href = "/billing-portal";
            manageButton.className = "subscription-button";
            manageButton.innerHTML = "Manage Payment Methods";
            actionsDiv.appendChild(manageButton);
          } else if (!userData.unlimited_access) {
            const upgradeButton = document.createElement('a');
            upgradeButton.href = "/upgrade";
            upgradeButton.className = "subscription-button";
            upgradeButton.innerHTML = "Upgrade Account";
            actionsDiv.appendChild(upgradeButton);
          }
          
          subscriptionDiv.appendChild(subscriptionInfo);
          subscriptionDiv.appendChild(actionsDiv);
        })
        .catch(error => {
          console.error('Error:', error);
          subscriptionInfo.innerHTML = "Error loading subscription information.";
          subscriptionDiv.appendChild(subscriptionInfo);
        });
        
      reportContents.appendChild(div);
      reportContents.appendChild(subscriptionDiv);
      
      // Add password change section
      const passwordDiv = document.createElement('div');
      passwordDiv.className = 'password-section';
      
      const passwordTitle = document.createElement('h3');
      passwordTitle.innerHTML = 'Change Password';
      passwordDiv.appendChild(passwordTitle);
      
      const passwordForm = document.createElement('form');
      passwordForm.className = 'password-form';
      passwordForm.id = 'passwordChangeForm';
      
      // Current password field
      const currentPasswordGroup = document.createElement('div');
      currentPasswordGroup.className = 'form-group';
      const currentPasswordLabel = document.createElement('label');
      currentPasswordLabel.innerHTML = 'Current Password';
      currentPasswordLabel.setAttribute('for', 'current_password');
      const currentPasswordInput = document.createElement('input');
      currentPasswordInput.type = 'password';
      currentPasswordInput.id = 'current_password';
      currentPasswordInput.name = 'current_password';
      currentPasswordInput.required = true;
      currentPasswordGroup.appendChild(currentPasswordLabel);
      currentPasswordGroup.appendChild(currentPasswordInput);
      
      // Add forgot password link
      const forgotLink = document.createElement('a');
      forgotLink.href = '/forgot-password';
      forgotLink.style.cssText = 'font-size: 12px; color: #7f578f; text-decoration: none; display: inline-block; margin-top: 5px;';
      forgotLink.innerHTML = "Don't remember your current password?";
      forgotLink.onmouseover = function() { this.style.textDecoration = 'underline'; };
      forgotLink.onmouseout = function() { this.style.textDecoration = 'none'; };
      currentPasswordGroup.appendChild(forgotLink);
      
      // New password field
      const newPasswordGroup = document.createElement('div');
      newPasswordGroup.className = 'form-group';
      const newPasswordLabel = document.createElement('label');
      newPasswordLabel.innerHTML = 'New Password';
      newPasswordLabel.setAttribute('for', 'new_password');
      const newPasswordInput = document.createElement('input');
      newPasswordInput.type = 'password';
      newPasswordInput.id = 'new_password';
      newPasswordInput.name = 'new_password';
      newPasswordInput.required = true;
      newPasswordGroup.appendChild(newPasswordLabel);
      newPasswordGroup.appendChild(newPasswordInput);
      const passwordReq = document.createElement('div');
      passwordReq.className = 'password-requirements';
      passwordReq.innerHTML = 'Must contain at least 9 characters, including one number and one special character';
      newPasswordGroup.appendChild(passwordReq);
      
      // Confirm password field
      const confirmPasswordGroup = document.createElement('div');
      confirmPasswordGroup.className = 'form-group';
      const confirmPasswordLabel = document.createElement('label');
      confirmPasswordLabel.innerHTML = 'Confirm New Password';
      confirmPasswordLabel.setAttribute('for', 'confirm_password');
      const confirmPasswordInput = document.createElement('input');
      confirmPasswordInput.type = 'password';
      confirmPasswordInput.id = 'confirm_password';
      confirmPasswordInput.name = 'confirm_password';
      confirmPasswordInput.required = true;
      confirmPasswordGroup.appendChild(confirmPasswordLabel);
      confirmPasswordGroup.appendChild(confirmPasswordInput);
      
      // Submit button
      const submitButton = document.createElement('button');
      submitButton.type = 'submit';
      submitButton.className = 'password-submit';
      submitButton.innerHTML = 'Change Password';
      
      // Message div
      const messageDiv = document.createElement('div');
      messageDiv.id = 'password-message';
      messageDiv.className = 'password-message';
      
      passwordForm.appendChild(currentPasswordGroup);
      passwordForm.appendChild(newPasswordGroup);
      passwordForm.appendChild(confirmPasswordGroup);
      passwordForm.appendChild(submitButton);
      passwordForm.appendChild(messageDiv);
      
      // Add form submit handler
      passwordForm.onsubmit = function(e) {
        e.preventDefault();
        
        const currentPassword = document.getElementById('current_password').value;
        const newPassword = document.getElementById('new_password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        // Client-side validation
        if (newPassword !== confirmPassword) {
          showPasswordMessage('New passwords do not match.', 'error');
          return;
        }
        
        // Password requirements check
        const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?])(?=.*[a-zA-Z]).{9,}$/;
        if (!passwordRegex.test(newPassword)) {
          showPasswordMessage('Password must contain at least 9 characters, including one number and one special character.', 'error');
          return;
        }
        
        // Submit to server
        fetch('/app/changePassword', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'same-origin',  // Include cookies for session
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword,
            confirm_password: confirmPassword
          })
        })
        .then(response => response.json())
        .then(result => {
          if (result.status === 'success') {
            showPasswordMessage('Password changed successfully!', 'success');
            passwordForm.reset();
          } else {
            showPasswordMessage(result.message || 'Failed to change password.', 'error');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          showPasswordMessage('An error occurred. Please try again.', 'error');
        });
      };
      
      function showPasswordMessage(message, type) {
        const messageDiv = document.getElementById('password-message');
        messageDiv.innerHTML = message;
        messageDiv.className = 'password-message ' + type;
        messageDiv.style.display = 'block';
        
        // Hide message after 5 seconds
        setTimeout(() => {
          messageDiv.style.display = 'none';
        }, 5000);
      }
      
      passwordDiv.appendChild(passwordForm);
      reportContents.appendChild(passwordDiv);

      const statusText = document.createElement('p');
      statusText.style.marginTop = "10px";

      const button = document.createElement('button');
      button.innerHTML = "Restore Last Deleted";
      button.className = "btn";
      button.style.marginTop = "10px";
      button.onclick = function () {
        console.log("Restore Last Deleted");
        fetch('/app/restoreDeletion', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        }).then(response => response.json())
          .then(result => {
            console.log(result);
            if (result["status"] === "success") {
              statusText.innerHTML = "Last deleted report restored.";
            } else if (result["status"] === "no_last_deleted") {
              statusText.innerHTML = "No report to restore.";
            } else if (result["status"] === "not_found") {
              statusText.innerHTML = "Error: Report not found.";
            } else {
              statusText.innerHTML = "Error: " + result["status"];
            }
          }).catch(error => {console.error('Error:', error); throw error;});
      };
      reportContents.appendChild(button);
      reportContents.appendChild(statusText);
    }
    function HasFreeAccount() {
      console.log("HasFreeAccount");
      const reportContents = document.getElementById('details');

      const title = document.createElement('h3');
      title.innerHTML = "Your account is limited.";
      reportContents.appendChild(title);

      const div = document.createElement('div');
      div.style.paddingBottom = "25px";
      const a = document.createElement('a');
      a.href = "/upgrade";
      a.target = "_blank";
      a.innerHTML = "Upgrade";
      a.style.color = "blue";
      div.appendChild(a);
      reportContents.appendChild(div);
      PopulateDetails(0);
    }

    function HasPaidAccount(accountType) {
      console.log("HasPaidAccount");
      PopulateDetails(accountType);
    }

    function InitialLoad() {

      const userWelcomeNameDisplay = document.getElementById('welcome-name-display');
      fetch('/app/getUser')
        .then(response => response.json())
        .then(result => {
          userWelcomeNameDisplay.innerHTML = result["email"];
          let accountType = result["accountType"];

          if (accountType === 0) {
            console.log("Free account");
            HasFreeAccount();
          } else {
            console.log("Paid account");
            HasPaidAccount(accountType);
          }
        }).catch(error => {console.error('Error:', error); throw error;});
    };
    InitialLoad();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SimpleReports Upgrade</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Work+Sans:300,400,500,600,700">
  <link rel="stylesheet" href="./css/desktopstyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./css/ffolders.min.css" />

  <style>
    .spacingFolder {
      margin-right: 30px;
      margin-bottom: 30px;
    }

    .spacingFolder:last-child {
      margin-right: 0;
    }

    #reportContents {
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Subscription section styles */
    .subscription-section {
      background-color: #f9f9f9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .subscription-section h2 {
      margin-top: 0;
      color: #333;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
    
    .subscription-info {
      margin-bottom: 20px;
    }
    
    .subscription-info p {
      margin: 5px 0;
    }
    
    .subscription-label {
      font-weight: bold;
      display: inline-block;
      width: 150px;
    }
    
    .subscription-actions {
      margin-top: 20px;
    }
    
    .subscription-button {
      background-color: #7f578f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
    }
    
    .subscription-button:hover {
      background-color: #6a4478;
    }
  </style>
</head>

<body>
  <img src="./full_logo.png" alt="SimpleReports Logo" width="150px" class="logo"
    style="position: absolute; top: 0; left: 0" />
  <div id="chartpanel" class="row" data-equalizer>
    <div class="column small-12 left_panel">
      <header data-equalizer-watch>
        <i class="fa fa-bars menu_top_icon" aria-hidden="true"></i>

        <div class="right_nav">
          <div class="welcome-profile-text"><span class="user-name">
              <span id="welcome-name-display"></span>
            </span></div>

          <a href="/main"><i class="fa fa-cog dashboard-icons dashboard-icons-next-to-another"
              aria-hidden="true"></i></a>
          <i class="fa fa-user-circle dashboard-icons" aria-hidden="true"></i>

        </div>
        <div class="title">
          <h2 style="text-align: center;">SETTINGS</h2>
        </div>
      </header>


      <div id="chart_table">
        <form id="chart_datas">
        </form>

        <div id="details">
        </div>

      </div>
      <div class="spacer"></div>

    </div>
  </div>
  </div>
  <script>
    function PopulateDetails(accountType) {
      console.log("PopulateDetails");
      const reportContents = document.getElementById('details');
      const div = document.createElement('div');
      div.style.borderRadius = "10px";
      div.style.border = "1px solid #d3d3d3";
      div.style.padding = "10px";
      div.style.marginTop = "10px";
      const h3 = document.createElement('h3');
      h3.innerHTML = "Account Information";
      div.appendChild(h3);
      const p1 = document.createElement('p');
      p1.innerHTML = "Account Type: ";
      if (accountType === 1) {
        p1.innerHTML += "Trial";
      } else if (accountType === 2) {
        p1.innerHTML += "Active";
      } else {
        p1.innerHTML += "Inactive";
      }
      div.appendChild(p1);
      const p2 = document.createElement('p');
      if (accountType === 1) {
        p2.innerHTML = "Subscription Status: Trial";
      } else if (accountType === 2) {
        p2.innerHTML = "Subscription Status: Active";
      } else {
        p2.innerHTML = "Subscription Status: Inactive";
      }

      div.appendChild(p2);
      // Add subscription management section
      const subscriptionDiv = document.createElement('div');
      subscriptionDiv.style.borderRadius = "10px";
      subscriptionDiv.style.border = "1px solid #d3d3d3";
      subscriptionDiv.style.padding = "10px";
      subscriptionDiv.style.marginTop = "20px";
      subscriptionDiv.className = "subscription-section";
      
      const subscriptionTitle = document.createElement('h3');
      subscriptionTitle.innerHTML = "Subscription Management";
      subscriptionDiv.appendChild(subscriptionTitle);
      
      // Create subscription info div
      const subscriptionInfo = document.createElement('div');
      subscriptionInfo.className = "subscription-info";
      
      // Fetch user subscription details
      fetch('/app/getUser')
        .then(response => response.json())
        .then(userData => {
          // Add subscription status
          const statusP = document.createElement('p');
          const statusLabel = document.createElement('span');
          statusLabel.className = "subscription-label";
          statusLabel.innerHTML = "Status:";
          statusP.appendChild(statusLabel);
          
          if (userData.unlimited_access) {
            statusP.innerHTML += " Unlimited Access";
            
            const infoP = document.createElement('p');
            infoP.innerHTML = "You have unlimited access to SimpleReports.";
            subscriptionInfo.appendChild(infoP);
          } else if (userData.is_paid) {
            statusP.innerHTML += " Active Subscription";
            
            const infoP = document.createElement('p');
            infoP.innerHTML = "Your subscription is active. You have full access to SimpleReports.";
            subscriptionInfo.appendChild(infoP);
          } else if (userData.trial_end_date) {
            statusP.innerHTML += " Trial Period";
            
            const trialEndDate = new Date(userData.trial_end_date).toLocaleDateString();
            const infoP = document.createElement('p');
            infoP.innerHTML = `Your trial period ends on: <strong>${trialEndDate}</strong>`;
            subscriptionInfo.appendChild(infoP);
            
            const pricingP = document.createElement('p');
            pricingP.innerHTML = "After your trial ends, you will be charged $9.99/month.";
            subscriptionInfo.appendChild(pricingP);
          } else {
            statusP.innerHTML += " No Active Subscription";
          }
          
          subscriptionInfo.appendChild(statusP);
          
          // Add subscription actions
          const actionsDiv = document.createElement('div');
          actionsDiv.className = "subscription-actions";
          
          if (userData.stripe_customer_id && !userData.unlimited_access) {
            const manageButton = document.createElement('a');
            manageButton.href = "/billing-portal";
            manageButton.className = "subscription-button";
            manageButton.innerHTML = "Manage Payment Methods";
            actionsDiv.appendChild(manageButton);
          } else if (!userData.unlimited_access) {
            const upgradeButton = document.createElement('a');
            upgradeButton.href = "/upgrade";
            upgradeButton.className = "subscription-button";
            upgradeButton.innerHTML = "Upgrade Account";
            actionsDiv.appendChild(upgradeButton);
          }
          
          subscriptionDiv.appendChild(subscriptionInfo);
          subscriptionDiv.appendChild(actionsDiv);
        })
        .catch(error => {
          console.error('Error:', error);
          subscriptionInfo.innerHTML = "Error loading subscription information.";
          subscriptionDiv.appendChild(subscriptionInfo);
        });
        
      reportContents.appendChild(div);
      reportContents.appendChild(subscriptionDiv);

      const statusText = document.createElement('p');
      statusText.style.marginTop = "10px";

      const button = document.createElement('button');
      button.innerHTML = "Restore Last Deleted";
      button.className = "btn";
      button.style.marginTop = "10px";
      button.onclick = function () {
        console.log("Restore Last Deleted");
        fetch('/app/restoreDeletion', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        }).then(response => response.json())
          .then(result => {
            console.log(result);
            if (result["status"] === "success") {
              statusText.innerHTML = "Last deleted report restored.";
            } else if (result["status"] === "no_last_deleted") {
              statusText.innerHTML = "No report to restore.";
            } else if (result["status"] === "not_found") {
              statusText.innerHTML = "Error: Report not found.";
            } else {
              statusText.innerHTML = "Error: " + result["status"];
            }
          }).catch(error => {console.error('Error:', error); throw error;});
      };
      reportContents.appendChild(button);
      reportContents.appendChild(statusText);
    }
    function HasFreeAccount() {
      console.log("HasFreeAccount");
      const reportContents = document.getElementById('details');

      const title = document.createElement('h3');
      title.innerHTML = "Your account is limited.";
      reportContents.appendChild(title);

      const div = document.createElement('div');
      div.style.paddingBottom = "25px";
      const a = document.createElement('a');
      a.href = "/upgrade";
      a.target = "_blank";
      a.innerHTML = "Upgrade";
      a.style.color = "blue";
      div.appendChild(a);
      reportContents.appendChild(div);
      PopulateDetails(0);
    }

    function HasPaidAccount(accountType) {
      console.log("HasPaidAccount");
      PopulateDetails(accountType);
    }

    function InitialLoad() {

      const userWelcomeNameDisplay = document.getElementById('welcome-name-display');
      fetch('/app/getUser')
        .then(response => response.json())
        .then(result => {
          userWelcomeNameDisplay.innerHTML = result["email"];
          let accountType = result["accountType"];

          if (accountType === 0) {
            console.log("Free account");
            HasFreeAccount();
          } else {
            console.log("Paid account");
            HasPaidAccount(accountType);
          }
        }).catch(error => {console.error('Error:', error); throw error;});
    };
    InitialLoad();
  </script>
</body>

</html>

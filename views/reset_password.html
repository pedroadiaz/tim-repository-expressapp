<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Work+Sans:300,400,500,600,700'>
    <style>
        body {
            margin: 0;
            color: #c9c9c9;
            background: #f0f0f0;
            font-family: 'Work Sans', sans-serif;
            font-size: 1.1rem;
        }

        .background-cover {
            position: absolute;
            height: 45vh;
            width: 100%;
        }

        *,
        :after,
        :before {
            box-sizing: border-box
        }

        .clearfix:after,
        .clearfix:before {
            content: '';
            display: table
        }

        .clearfix:after {
            clear: both;
            display: block
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .login-wrap {
            width: 100%;
            margin: auto;
            max-width: 700px;
            min-height: 550px;
            position: relative;
            box-shadow: 0 12px 15px 0 rgba(0, 0, 0, .3), 0 17px 50px 0 rgba(0, 0, 0, .3);
        }

        .login-html {
            width: 100%;
            height: 100%;
            position: absolute;
            padding: 90px 70px 50px 70px;
            background: linear-gradient(180deg, rgb(42, 82, 149) 0%, rgb(161, 109, 182) 40%);
        }

        .login-form {
            min-height: 345px;
            position: relative;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .login-form .group {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .login-form .group .label,
        .login-form .group .input,
        .login-form .group .button {
            width: 100%;
            color: #fff;
            display: block;
        }

        .login-form .group .input,
        .login-form .group .button {
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .1);
        }

        .login-form .group input[data-type="password"] {
            input-security: auto;
            -webkit-text-security: circle;
        }

        .login-form .group .label {
            color: #e7e7e7;
            font-size: 15px;
            padding-bottom: 10px;
        }

        .login-form .group .button {
            background: #7f578f;
            cursor: pointer;
        }

        .hr {
            height: 2px;
            margin: 60px 0 50px 0;
            background: rgba(255, 255, 255, .2);
        }

        .foot-lnk {
            text-align: center;
            font-size: 1.1rem;
        }

        .page-title {
            font-size: 2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
        }

        .message {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .message.error {
            background-color: rgba(255, 0, 0, 0.1);
            color: #ffcccc;
        }

        .message.success {
            background-color: rgba(0, 255, 0, 0.1);
            color: #ccffcc;
        }

        .password-requirements {
            color: #e7e7e7;
            font-size: 0.9rem;
            margin-top: 5px;
            padding-left: 5px;
        }
    </style>
</head>

<body>
    <div class="background-cover"></div>

    <div class="login-wrap">
        <div class="login-html">
            <div class="page-title">Change Password</div>
            
            <div class="login-form">
                <% if (typeof error !== 'undefined') { %>
                <div class="message error">
                    <%= error %>
                </div>
                <% } %>
                
                <% if (typeof success !== 'undefined') { %>
                <div class="message success">
                    <%= success %>
                </div>
                <% } %>
                
                <form id="reset-password" method="POST" action="./reset-password">
                    <input type="hidden" name="email" value="<%= email %>">
                    <input type="hidden" name="token" value="<%= token %>">
                    
                    <div class="group">
                        <label for="temp_password" class="label">Temporary Password</label>
                        <input id="temp_password" type="password" class="input" data-type="password" name="temp_password" required>
                    </div>
                    
                    <div class="group">
                        <label for="new_password" class="label">New Password</label>
                        <input id="new_password" type="password" class="input" data-type="password" name="new_password" required>
                        <div class="password-requirements">
                            Password must contain at least one number, one letter, and be at least 9 characters long
                        </div>
                    </div>
                    
                    <div class="group">
                        <label for="confirm_password" class="label">Confirm New Password</label>
                        <input id="confirm_password" type="password" class="input" data-type="password" name="confirm_password" required>
                    </div>
                    
                    <div class="group">
                        <input type="submit" class="button" value="Change Password">
                    </div>
                </form>
                <div class="hr"></div>
                <div class="foot-lnk">
                    <a href="./login">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
